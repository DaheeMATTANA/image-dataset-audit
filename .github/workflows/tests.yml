# Runs pytest on every pull request (and on pushes to master).
# data/ is not in the repository, so tests that need Food-101 are skipped here.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only exact version tags (no "v10" shortcut).
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Full environment: the tests import pandas, numpy and Pillow.
      # Python version comes from .python-version.
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install project and dev tools
        run: uv sync --locked

      # -rs lists each skipped test and its reason in the log.
      - name: Pytest
        run: uv run --no-sync pytest -rs
