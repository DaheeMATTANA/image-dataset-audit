# Runs Ruff on every pull request (and on pushes to master).
# Only source files are read, so the dataset is not needed here.
name: lint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only exact version tags (no "v10" shortcut).
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Install only the dev tools (Ruff, pytest, ...), not pandas/numpy etc.
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dev tools
        run: uv sync --locked --only-dev

      # github format puts each error as a comment on the PR diff line.
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check --diff .
